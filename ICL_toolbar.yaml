Tools:
  config:
    cols: 3
  buttons:
    iocmanager:
      type: shell
      commands:
        - iocmanager icl
    universal screen:
      type: shell
      redirectCommandOutput: true
      commands:
        - pydm -m "title=ICL, hutch=ICL, config=/reg/g/pcds/epics-dev/screens/pydm/sds-ui/universal-sds-screen/config/icl/icl-sds.json" --hide-nav-bar --hide-menu-bar /reg/g/pcds/epics-dev/screens/pydm/sds-ui/universal-sds-screen/sds.py

    Flow Meters:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-menu-bar -m "BASE=ICL:SDS:SFM" /reg/g/pcds/epics-dev/screens/pydm/sds/senserion-flow-meter.ui

FEL SIM:
  config:
    cols: 3
  buttons:
    User Screen:
      type: shell
      commands:
        - bash /reg/g/pcds/epics-dev/screens/pydm/sds/user-screen/icl/launch.sh

    RCC VAC:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-menu-bar /cds/home/j/jozamudi/dev/icl/rcc/RCC-VAC.ui

    Timer Catcher:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-menu-bar -m "TITLE='FEL SIM',BASE=ICL:FEL:SIM:RCC" /cds/home/j/jozamudi/dev/icl/rcc/RCC-Controls.ui

    Timer PUMP:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-menu-bar -m "TITLE='FEL SIM PUMP',BASE=ICL:FEL:HPLC:RCC,PCM=ICL:SDS:RCC:PCM:A" /cds/home/j/jozamudi/dev/icl/rcc/RCC-Controls.ui
        #- pydm --hide-nav-bar --hide-menu-bar -m "TITLE='FEL SIM',BASE=ICL:FEL:HPLC:RCC, PCM=ICL:SDS:RCC:PCM:B" /reg/g/pcds/epics-dev/screens/pydm/sds/rcc/Pumpless-RCC-Controls.ui
    Timer PUMP PCM:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-menu-bar -m "pv=ICL:SDS:RCC:PCM:B" /reg/g/pcds/epics-dev/screens/pydm/sds/universal-sds-screen/base-screens/proportionair_base.ui

    RCC Outlet:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-menu-bar -m "pv=ICL:SDS:VICI:01,valve=RCC-Outlet" /reg/g/pcds/epics-dev/screens/pydm/sds/4port-vici-valve/4port-vici-valve-clockface.py

    Switching Valves:
      type: shell
      commands:
        - /reg/g/pcds/epics-dev/screens/pydm/sds/universal-onoff-screen/launch.sh ICL
      redirectCommandOutput: true
        #- pydm --log_level DEBUG --hide-nav-bar --hide-menu-bar --hide-status-bar -m "hutch=ICL" /reg/g/pcds/epics-dev/screens/pydm/sds/universal-onoff-screen/onoffvalves.py

    FEL SIM HPLCs:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-status-bar -m 'base_pv=ICL:FEL:LC20, hplc_count=2' /reg/g/pcds/epics-dev/screens/pydm/sds/universal-sds-screen/base-screens/hplc-screen.py

Ambiant:
  config:
    cols: 3
  buttons:

    Timer:
      type: shell
      commands:
        - pydm --hide-nav-bar --hide-menu-bar -m "TITLE='RCC WALL',BASE=ICL:RCC:PUMP, PCM=ICL:SDS:RCC:PCM:A" /reg/g/pcds/epics-dev/screens/pydm/sds/rcc/Pumpless-RCC-Controls.ui

