LCLS:
  config:
    cols: 4

  buttons:
    LCLS Home:
      type: shell
      redirectCommandOutput: true
      commands:
        - /cds/group/pcds/setup/pydm_lclshome.sh
    Elog Grabber:
      type: shell
      redirectCommandOutput: true
      commands:
        -/reg/g/pcds/engineering_tools/latest-released/scripts/eloggrabber
    PMPS Diagnostics:
      type: shell
      commands:
        - /cds/group/pcds/setup/pmps-launcher.sh LFE


Beamline:
  config:
    cols: 4
  buttons:
    XPP Beamline Vacuum:
      type: shell
      commands:
        - pydm /reg/g/pcds/epics-dev/screens/pydm/xpp/XPPVac.ui
    
    XPP-PCI-02:
      type: shell
      commands:
        - /reg/g/pcds/epics-dev/tparas/ioc/xpp/ioc-xpp-qpc/build/iocBoot/ioc-xpp-pci-02/pydm-ioc-xpp-pci-02.cmd
    
    XPP-PCI-01:
      type: shell
      commands:
        - /reg/g/pcds/epics-dev/tparas/ioc/xpp/ioc-xpp-qpc/build/iocBoot/ioc-xpp-pci-01/pydm-ioc-xpp-pci-01.cmd
    
    LODCM Temperature:
      type: shell
      commands:
        - /cds/group/pcds/epics-dev/espov/ioc/xpp/lakeshore336/build/iocBoot/ioc-xpp-lodcm-ls336-01/edm-ioc-xpp-lodcm-ls336-01.cmd
        - /cds/group/pcds/epics-dev/espov/ioc/xpp/lakeshore336/build/iocBoot/ioc-xpp-lodcm-ls336-02/edm-ioc-xpp-lodcm-ls336-02.cmd
      titles:
        - LakeShore - Crystal 1
        - LakeShore - Crystal 2

    LODCM Motion:
      type: shell
      commands:
        - /cds/group/pcds/epics-dev/screens/pydm/xpp/dev/lodcm_screen_T1.sh
        - /cds/group/pcds/epics-dev/screens/pydm/xpp/dev/lodcm_screen_D1.sh
        - /cds/group/pcds/epics-dev/screens/pydm/xpp/dev/lodcm_screen_T2.sh
        - /cds/group/pcds/epics-dev/screens/pydm/xpp/dev/lodcm_screen_D2.sh
      titles:
        - Tower 1
        - Diag 1
        - Tower 2
        - Diag 2

Laser:
  config:
    cols: 4


Detectors:
  config:
    cols: 4


Users:
  config:
    cols: 4


