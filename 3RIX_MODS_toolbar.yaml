General:
  config:
    cols: 4
  buttons:
    LCLS Home:
      type: shell
      redirectCommandOutput: true
      commands:
        - /reg/g/pcds/setup/pydm_lclshome.sh
    Cam Viewer:
      type: shell
      commands:
        - /reg/g/pcds/pyps/config/las/camviewer.sh
    nf-ff-alignment:
      type: shell
      titles:
        - INJ_MP1_TF1
        - EJX_MP1_TF1
      commands:
        - /cds/group/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_nf_ff_alignment.sh lm3k2_inj_mp1.toml
        - /cds/group/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_nf_ff_alignment.sh lm3k2_ejx_mp1.toml

    SmarActs:
      type: shell
      titles:
        - INJ_MP1_MR1
        - INJ_MP1_MR2
        - INJ_MP1_ATT1_WP1
        - EJX_MP1_LS1_X
        - EJX_MP1_LS1_Y
        - EJX_MP1_LS1_Z
      commands:
        - "/reg/g/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_inj_tip_tilts mr1"
        - "/reg/g/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_inj_tip_tilts mr2"
        - "/cds/group/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_smaract_expert_screen LM3K2:INJ_MP1_ATT1_WP1"
        - "/cds/group/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_smaract_expert_screen LM3K2:EJX_MP1_LS1_X"
        - "/cds/group/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_smaract_expert_screen LM3K2:EJX_MP1_LS1_Y"
        - "/cds/group/pcds/epics-dev/screens/pydm/las/mods_3rix/launch_smaract_expert_screen LM3K2:EJX_MP1_LS1_Z"

Tools:
Tools:
  config:
    cols: 2
  buttons:
    iocmanager:
      type: shell
      commands:
        - /reg/g/pcds/pyps/config/las/iocmanager.sh
 
